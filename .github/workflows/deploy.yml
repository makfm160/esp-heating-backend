name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Bejelentkezés a GHCR-be fix v3-as verzióval
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Buildx beállítása fix v3-as verzióval
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Kisbetűssé alakítjuk a felhasználónevet
    - name: Downcase repo owner
      run: |
        echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
      env:
        OWNER: ${{ github.repository_owner }}

    # Építés és feltolás fix v5-ös verzióval
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ghcr.io/${{ env.OWNER_LC }}/esp-heating-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max